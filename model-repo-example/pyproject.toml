[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-repo-example"
version = "0.1.0"
description = "Example model repository implementing core interfaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Platform Team" }]
dependencies = [
  "mlops-core-lib[config,training,tracking]>=0.1.0",
  "orchestrator>=0.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "mypy>=1.9.0", "ruff>=0.4.0"]

[project.scripts]
model-repo-example = "model_repo_example.main:main"

[tool.setuptools]
packages = ["model_repo_example"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
